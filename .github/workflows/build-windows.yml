name: Build Windows VST3

on:
  workflow_dispatch:
  push:
    branches: [Demo]

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build plugin
        run: cmake --build build --config Release --target Depthorator --parallel

      - name: Stage VST3 bundle
        shell: pwsh
        run: |
          $plugin = Get-ChildItem -Path build -Recurse -Directory -Filter Depthorator.vst3 | Select-Object -First 1
          if (-not $plugin) { throw "Depthorator.vst3 bundle not found" }
          New-Item -ItemType Directory -Force -Path artifact-demo | Out-Null
          New-Item -ItemType Directory -Force -Path artifact-full | Out-Null
          Copy-Item -Path $plugin.FullName -Destination artifact-demo -Recurse -Force
          Copy-Item -Path $plugin.FullName -Destination artifact-full -Recurse -Force
          if (-not (Test-Path "artifact-demo\Depthorator.vst3\Contents")) { throw "Demo VST3 bundle is incomplete" }
          if (-not (Test-Path "artifact-full\Depthorator.vst3\Contents\Resources")) { throw "Full resources missing" }
          Copy-Item "license\125A_Depthorator.license" "artifact-full\Depthorator.vst3\Contents\Resources\125A_Depthorator.license" -Force

      - name: Upload DEMO VST3
        uses: actions/upload-artifact@v4
        with:
          name: Depthorator-1.0.0-DEMO
          path: artifact-demo

      - name: Upload FULL VST3
        uses: actions/upload-artifact@v4
        with:
          name: Depthorator-1.0.0-FULL
          path: artifact-full
