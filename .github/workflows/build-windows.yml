name: Build Windows VST3

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build plugin
        run: cmake --build build --config Release --target Depthorator --parallel

      - name: Stage VST3 bundle
        shell: pwsh
        run: |
          $plugin = Get-ChildItem -Path build -Recurse -Directory -Filter Depthorator.vst3 | Select-Object -First 1
          if (-not $plugin) { throw "Depthorator.vst3 bundle not found" }
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item -Path $plugin.FullName -Destination artifact -Recurse -Force
          if (-not (Test-Path "artifact\Depthorator.vst3\Contents")) { throw "Staged VST3 bundle is incomplete" }

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: Depthorator-Windows-VST3
          path: artifact
