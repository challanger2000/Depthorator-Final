name: Auto Clear Windows VST3 Development QA

on:
  push:
    branches:
      - feature/autoclear-qdelay-20261122
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-vst3:
    runs-on: windows-2022
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4

      - name: Validate GUI layout geometry
        run: python tests/verify_autoclear_layout.py

      - name: Configure Windows x64
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DBUILD_TESTING=ON

      - name: Compile VST3 and release-active core regression
        run: cmake --build build --config Release --target Depthorator DepthoratorAutoClearTests DepthoratorNativeAudioTests --parallel

      - name: Auto Clear deterministic DSP contract
        run: ctest --test-dir build -C Release --output-on-failure -R "depthorator_autoclear_core|depthorator_native_audio"

      - name: Build official Steinberg validator
        run: cmake --build build --config Release --target validator --parallel

      - name: Validate final 125A-named VST3 and verify ZIP roundtrip
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = '125A Depthorator.vst3'
          $binaryRelative = Join-Path 'Contents/x86_64-win' $expected
          $bundles = @(Get-ChildItem build -Directory -Recurse -Filter $expected |
            Where-Object { Test-Path (Join-Path $_.FullName $binaryRelative) })
          if ($bundles.Count -ne 1) { throw "Expected exactly one canonical build bundle, got $($bundles.Count)" }
          $bundle = $bundles[0]
          if ($bundle.Name -cne $expected) { throw 'Bundle name does not match 125A standard' }
          $validator = Get-ChildItem build -File -Recurse -Filter validator.exe | Select-Object -First 1
          if (-not $validator) { throw 'Official Steinberg validator not built' }

          # Stage exactly what is going into the artifact, without renaming
          # any compiled binary or bundle directory in a CI script.
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item -LiteralPath $bundle.FullName -Destination 'artifact' -Recurse -Force
          $stagedBundle = Join-Path (Resolve-Path 'artifact').Path $expected
          $stagedBinary = Join-Path $stagedBundle $binaryRelative
          if (-not (Test-Path -LiteralPath $stagedBinary)) { throw 'Expected standard-named inner VST3 binary missing' }
          if ((Split-Path $stagedBinary -Leaf) -cne (Split-Path $stagedBundle -Leaf)) {
            throw 'Outer and inner VST3 filenames must be identical'
          }
          $oldName = Join-Path $stagedBundle 'Contents/x86_64-win/Depthorator.vst3'
          if (Test-Path -LiteralPath $oldName) { throw 'Unprefixed inner binary still present' }
          $bytes = [System.IO.File]::ReadAllBytes($stagedBinary)
          if ($bytes.Length -lt 65536 -or $bytes[0] -ne 77 -or $bytes[1] -ne 90) {
            throw 'Staged VST3 is not a plausible PE binary'
          }
          $machineOffset = [BitConverter]::ToInt32($bytes, 0x3C)
          $machine = [BitConverter]::ToUInt16($bytes, $machineOffset + 4)
          if ($machine -ne 0x8664) { throw 'Staged binary must be PE x64' }
          $metadata = Join-Path $stagedBundle 'Contents/Resources/moduleinfo.json'
          $gui = Join-Path $stagedBundle 'Contents/Resources/Depthorator.uidesc'
          if (-not (Test-Path $metadata) -or -not (Test-Path $gui)) { throw 'VST3 metadata or editor resources missing' }
          # The pinned Steinberg moduleinfotool may emit trailing commas,
          # which generic JSON parsers reject. Normalize ONLY the final staged
          # copy; validate its real JSON structure before both validator runs.
          $rawInfo = Get-Content -LiteralPath $metadata -Raw
          $normalizedInfo = [regex]::Replace($rawInfo, ',(?=\s*})|,(?=\s*\])', '')
          $parsedInfo = $normalizedInfo | ConvertFrom-Json -ErrorAction Stop
          if (-not $parsedInfo.Classes -or $parsedInfo.Classes.Count -ne 2) {
            throw 'Metadata does not contain exactly two factory classes'
          }
          $normalizedInfo = $parsedInfo | ConvertTo-Json -Depth 30
          [System.IO.File]::WriteAllText($metadata, $normalizedInfo, [System.Text.UTF8Encoding]::new($false))
          $checkInfo = Get-Content -LiteralPath $metadata -Raw | ConvertFrom-Json -ErrorAction Stop
          if ($checkInfo.Name -cne '125A Depthorator') { throw 'Parsed canonical metadata name mismatch' }
          $info = Get-Content -LiteralPath $metadata -Raw
          if ($info -notmatch '"URL"\s*:\s*""') {
            throw 'Public plugin metadata must not expose a personal repository URL'
          }
          if ($info -notmatch '"Name"\s*:\s*"125A Depthorator"') {
            throw 'Factory component name does not use 125A branding'
          }
          if ($info -notmatch '"Name"\s*:\s*"125A Depthorator Controller"') {
            throw 'Controller class name does not use 125A branding'
          }
          foreach ($cid in @('7C4A2C1151E34CB19F72A2F43A7E1C10','8A6C914E48F147F7A3D2B9D0E5B61A22')) {
            if ($info -notmatch $cid) { throw "Missing historical VST3 class ID: $cid" }
          }
          $versions = [regex]::Matches($info, '"Version"\s*:\s*"([^"]+)"')
          if ($versions.Count -ne 3 -or @($versions | Where-Object { $_.Groups[1].Value -ne '1.2.0' }).Count) {
            throw 'Plugin factory/controller version mismatch'
          }
          if ((Get-Content -LiteralPath $gui -Raw) -notmatch 'AutoClearEnable') {
            throw 'Auto Clear ON/OFF GUI control is not bundled'
          }
          & $validator.FullName $stagedBundle 2>&1 | Tee-Object -FilePath validator-result.txt
          if ($LASTEXITCODE -ne 0) { throw 'Official Steinberg validator failed on the final staged bundle' }

          # Make a roundtrip ZIP and validate the unpacked, actual shipping tree.
          Compress-Archive -LiteralPath $stagedBundle -DestinationPath package-roundtrip.zip -CompressionLevel Optimal
          Expand-Archive -LiteralPath package-roundtrip.zip -DestinationPath unpacked -Force
          $zipBundle = Join-Path (Resolve-Path unpacked).Path $expected
          $zipBinary = Join-Path $zipBundle $binaryRelative
          if (-not (Test-Path -LiteralPath $zipBinary)) { throw 'Artifact ZIP lost the installable VST3 folder/inner binary' }
          $zipMetadata = Join-Path $zipBundle 'Contents/Resources/moduleinfo.json'
          $zipInfo = Get-Content -LiteralPath $zipMetadata -Raw | ConvertFrom-Json -ErrorAction Stop
          if ($zipInfo.Name -cne '125A Depthorator') { throw 'Unzipped JSON metadata name mismatch' }
          if ((Get-FileHash $zipBinary).Hash -cne (Get-FileHash $stagedBinary).Hash) {
            throw 'ZIP changed the VST3 binary'
          }
          & $validator.FullName $zipBundle 2>&1 | Tee-Object -FilePath validator-zip-result.txt
          if ($LASTEXITCODE -ne 0) { throw 'Official validator failed on unzipped shipping bundle' }
          Get-FileHash $zipBinary -Algorithm SHA256 | Format-List
          Write-Host "125A_NAMING_PASS: outer and inner $expected, factory and class IDs verified"
      - name: Run independently built 125A Plugin Tester v0.3.3 on exact staged VST3
        timeout-minutes: 25
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $testerRun = 44780614241
          $testerRepository = 'challanger2000/125A-Plugin-Tester-Final'
          $testerArtifact = '125A-Plugin-Tester-v0.3.3-Windows-x64'
          New-Item -ItemType Directory -Force -Path 'qa-tester' | Out-Null
          gh run download $testerRun -R $testerRepository -n $testerArtifact -D 'qa-tester'
          if ($LASTEXITCODE -ne 0) { throw 'Pinned v0.3.3 tester artifact could not be downloaded' }
          $tester = Get-ChildItem 'qa-tester' -Recurse -File -Filter '125A_Plugin_Tester_v0.3.3.exe' | Select-Object -First 1
          if (-not $tester) { throw 'Pinned portable tester executable missing' }
          $expectedTesterSha256 = '5dc4ec47293290a58fbf12aaab49a3744fc41b51bbcdac4c4e34b6db3db76a98'
          if ((Get-FileHash $tester.FullName -Algorithm SHA256).Hash.ToLowerInvariant() -cne $expectedTesterSha256) {
            throw 'Tester SHA-256 does not match independently inspected pinned artifact'
          }
          $plugin = Join-Path (Resolve-Path 'artifact').Path '125A Depthorator.vst3'
          if (-not (Test-Path (Join-Path $plugin 'Contents/x86_64-win/125A Depthorator.vst3'))) {
            throw 'Canonical VST3 missing before Plugin Tester'
          }
          $env:125A_PLUGIN_TESTER_REPORT_DIR = Join-Path (Get-Location).Path 'qa-reports'
          New-Item -ItemType Directory -Force -Path $env:125A_PLUGIN_TESTER_REPORT_DIR | Out-Null
          # --portable-test is the portable build's documented headless path.
          # The portable tester is a Windows GUI-subsystem executable.
          # PowerShell's call operator does not wait for it and the prior
          # $LASTEXITCODE may still be zero from gh run download. The
          # portable test's own Windows CI uses Start-Process -Wait.
          $quotedPlugin = '"' + $plugin + '"'
          $tested = Start-Process -FilePath $tester.FullName -ArgumentList @('--portable-test', $quotedPlugin) -Wait -PassThru
          $exit = $tested.ExitCode
          Write-Host "125A Plugin Tester v0.3.3 completed exit code: $exit"
          $files = @(Get-ChildItem $env:125A_PLUGIN_TESTER_REPORT_DIR -File -ErrorAction SilentlyContinue)
          if ($files.Count -lt 4) { throw "Insufficient Plugin Tester reports: $($files.Count)" }
          $report = $files | Where-Object { $_.Name.EndsWith('_125A_QA_Report.json') } | Select-Object -First 1
          if (-not $report) { throw 'Structured 125A QA JSON is missing' }
          $parsed = Get-Content $report.FullName -Raw | ConvertFrom-Json -ErrorAction Stop
          if ($parsed.status -ne 'PASS' -or $exit -ne 0) {
            throw "125A Plugin Tester DID NOT PASS: status=$($parsed.status), exit=$exit, report=$($report.FullName)"
          }
          foreach ($f in $files) {
            Write-Host "REPORT $($f.Name) size=$($f.Length)"
          }
          Write-Host '125A_PLUGIN_TESTER_V033_PASS: actual built/staged VST3'
      - name: Retain 125A QA reports even on a failed test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Depthorator-AutoClear-125A-Tester-QA
          path: qa-reports/
          if-no-files-found: warn
      - name: Assemble canonical Windows Gumroad-format candidate ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archiveName = '125A_Depthorator_v1.2.0_Windows_x64_Gumroad.zip'
          $bundleName = '125A Depthorator.vst3'
          $bundle = Join-Path (Resolve-Path 'artifact').Path $bundleName
          if (-not (Test-Path $bundle)) { throw 'The staged canonical VST3 directory is missing' }
          New-Item -ItemType Directory -Force -Path 'candidate' | Out-Null
          Copy-Item -LiteralPath $bundle -Destination 'candidate' -Recurse -Force
          foreach ($file in @('INSTALL_DE.txt','INSTALL_EN.txt','README.md','LICENSE.txt')) {
            if (-not (Test-Path $file)) { throw "Release documentation is missing: $file" }
            Copy-Item -LiteralPath $file -Destination 'candidate' -Force
          }
          Compress-Archive -Path 'candidate/*' -DestinationPath $archiveName -CompressionLevel Optimal -Force
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $archiveName).Path)
          try {
            $entries = @($archive.Entries | ForEach-Object { $_.FullName.Replace('\\','/') })
            $dllName = "$bundleName/Contents/x86_64-win/$bundleName"
            if ($entries -cnotcontains $dllName) { throw 'ZIP missing the exact inner 125A-branded VST3 binary' }
            if ($entries | Where-Object { $_ -match '^artifact/' -or $_ -match '^candidate/' }) {
              throw 'ZIP incorrectly contains CI staging directories'
            }
            foreach ($name in @('INSTALL_DE.txt','INSTALL_EN.txt','README.md','LICENSE.txt')) {
              if ($entries -cnotcontains $name) { throw "Gumroad candidate omits $name" }
            }
            $metadata = $archive.GetEntry("$bundleName/Contents/Resources/moduleinfo.json")
            if (-not $metadata) { throw 'Gumroad ZIP missing plugin metadata' }
            $reader = [System.IO.StreamReader]::new($metadata.Open())
            try { $parsed = $reader.ReadToEnd() | ConvertFrom-Json -ErrorAction Stop }
            finally { $reader.Dispose() }
            if ($parsed.Name -cne '125A Depthorator') { throw 'Gumroad ZIP embeds wrong factory name' }
          } finally { $archive.Dispose() }
          $expanded = Join-Path (Get-Location).Path 'candidate-unpacked'
          Expand-Archive -LiteralPath $archiveName -DestinationPath $expanded -Force
          $binary = Join-Path $expanded "$bundleName/Contents/x86_64-win/$bundleName"
          $original = Join-Path $bundle "Contents/x86_64-win/$bundleName"
          if (-not (Test-Path $binary) -or
              (Get-FileHash $binary -Algorithm SHA256).Hash -cne (Get-FileHash $original -Algorithm SHA256).Hash) {
            throw 'Gumroad ZIP roundtrip changed the Windows plugin binary'
          }
          (Get-FileHash $archiveName -Algorithm SHA256).Hash | Out-File -Encoding ascii 'gumroad-candidate-sha256.txt'
          Write-Host "125A_GUMROAD_CANDIDATE_ZIP_PASS: $archiveName; no staging folder; exact branded VST3 and documents"
      - name: Upload release-format candidate, NOT owner-approved release
        uses: actions/upload-artifact@v4
        with:
          name: Depthorator-v1.2.0-Gumroad-Format-CANDIDATE
          path: |
            125A_Depthorator_v1.2.0_Windows_x64_Gumroad.zip
            gumroad-candidate-sha256.txt
          if-no-files-found: error
      - name: Upload development VST3 (not a release)
        uses: actions/upload-artifact@v4
        with:
          name: Depthorator-AutoClear-1.2-dev-Win64-VST3
          path: |
            artifact/
            validator-result.txt
            validator-zip-result.txt
          if-no-files-found: error
